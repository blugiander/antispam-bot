name: Aggiornamento Notturno Gist AntiSpam

on:
  schedule:
    # Esegue lo script ogni giorno alle 03:00 di notte (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Aggiunge un bottone su GitHub per far partire lo script manualmente quando vuoi

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Scarica il codice del bot
        uses: actions/checkout@v3

      - name: 🐍 Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Installa le librerie necessarie
        run: pip install requests beautifulsoup4

      - name: 🚀 Avvia la caccia allo spam!
        env:
          # GitHub Actions inietterà i tuoi token segreti qui in modo sicuro
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python updater.py
